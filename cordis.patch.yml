# dsh bundle patch: inserts one plugin row into a profile's config layer.
# `id` is the stable identity of this row, so a user can override its `config`
# from their own cordis.patch.yml by matching that id.
- insert:
    - id: github-repo
      name: 'dsh-plugin-github'
      config:
        # ── Permission boundary (most conservative by default: read and edit
        #    locally, but never write to a remote) ──────────────────────────
        # Allow remote writes such as pushing and creating repositories. While
        # this is off, gh_push and gh_commit{push:true} are refused outright.
        allowPush: false
        # Allow `--force-with-lease` pushes (still bounded by allowPush).
        allowForcePush: false
        # Allow POST/PATCH/PUT/DELETE on gh_api; read-only calls are unaffected.
        allowApiWrite: false

        # ── Repository allowlist ──────────────────────────────────────────
        # An empty array means no restriction by repository name (remote writes
        # are still gated by allowPush / allowApiWrite).
        # Accepted forms: owner/repo, owner/*, */repo, *.
        # Only strict owner/repo is accepted; a full URL is rejected, because a
        # URL's host and extra path segments cannot be checked reliably — that
        # was once enough to make the allowlist authorize a different repository.
        allowRepos: []

        # Whether read-only gh_api calls are also bounded by allowRepos.
        # Default false: once allowRepos is set, even reads are limited to
        # allowlisted repositories. Set true to permit reads outside it
        # (for example searching public repositories).
        allowApiReadOutsideAllowlist: false

        # Allow remotes other than github.com (self-hosted Git, an internal
        # GitLab, …). Default false. The allowlist constrains owner/repo but not
        # the host, so allowing any host means `http://attacker/your/repo.git`
        # passes the allowlist and the PAT is sent to the attacker.
        # Turn this on only when you really do talk to a self-hosted service.
        allowNonGithubRemotes: false

        # ── Account binding ───────────────────────────────────────────────
        # Whether to prompt for account binding when an operation needs
        # credentials but none is bound yet (one pasted PAT).
        # With this off nothing is asked; the operation proceeds and the remote
        # decides the outcome.
        allowAutoBind: true
        # Whether the prompt may collect a pasted token. With this off the
        # prompt only points at the environment variable / credential file.
        promptForToken: true
        # Path of the account file. Used only when the host has not mounted the
        # DSH credential service (ctx.credentials); when omitted it lives at
        # $DSH_HOME/github-accounts.json.
        # accountStorePath: '/path/to/github-accounts.json'

        # ── Credentials ───────────────────────────────────────────────────
        # Token reference name (a POSIX environment variable name). Its value is
        # read from the DSH credential service first, i.e. the `refs:` section of
        # $DSH_HOME/.credentials.yaml, or written with gh_config action=set.
        tokenRef: GITHUB_TOKEN
        # Environment variable to fall back to when the credential service has
        # no value.
        tokenEnv: GITHUB_TOKEN
        # Also fall back to .env.local / .env inside the workspace.
        dotenv: true

        # ── Behaviour ─────────────────────────────────────────────────────
        # Root directory for local clones. Omitted means the host process's
        # working directory.
        # workspaceRoot: '/path/to/clones'
        # The git executable to run. Omitted means `git` on PATH; set this when
        # git lives somewhere unusual (a bundled runtime, a portable install).
        # gitExecutable: 'git'
        # Timeout for a single git command, in milliseconds.
        commandTimeoutMs: 120000
        # Maximum characters of a diff returned to the model.
        maxDiffChars: 20000
        # Maximum characters of a file read returned to the model.
        maxReadChars: 40000
        # Commit author (omitted means the git global configuration; set both when
        # the machine has no global identity, or commits fail with
        # "Author identity unknown").
        # gitAuthorName: 'Your Name'
        # gitAuthorEmail: 'you@example.com'
